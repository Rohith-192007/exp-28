<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f0ff, #f5f7fb);
            color: #172033;
        }
        .login-card {
            width: min(100%, 380px);
            padding: 36px;
            border-radius: 18px;
            background: #fff;
            box-shadow: 0 18px 50px rgba(25, 45, 85, 0.12);
        }
        h1 { margin: 0 0 8px; font-size: 28px; }
        .subtitle { margin: 0 0 28px; color: #667085; }
        label { display: block; margin: 16px 0 8px; font-weight: 600; }
        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d0d5dd;
            border-radius: 9px;
            font-size: 15px;
        }
        input:focus {
            outline: 3px solid rgba(49, 94, 251, 0.15);
            border-color: #315efb;
        }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: 0;
            border-radius: 9px;
            background: #315efb;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover { background: #244bd3; }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to continue to your account.</p>
        <form>
            <label for="username">Username</label>
            <input id="username" name="username" type="text" placeholder="Enter your username" autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>

            <button type="submit">Login</button>
        </form>
    </main>
</body>
</html>
